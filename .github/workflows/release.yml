name: Build and release M1ss-UI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "26"
  BOOTLIN_BASE_URL: https://toolchains.bootlin.com/downloads/releases/toolchains

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Validate pushed version tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Use a version tag such as v1.0.0 or v1.0.0-rc.1."
            exit 1
          fi

  test:
    needs: validate
    uses: ./.github/workflows/test.yml

  build-frontend:
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: build-${{ matrix.platform }}
    needs: [test, build-frontend]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: amd64, arch: amd64, bootlin: x86-64 }
          - { platform: arm64, arch: arm64, bootlin: aarch64 }
          - { platform: armv7, arch: arm, goarm: "7", bootlin: armv7-eabihf }
          - { platform: armv6, arch: arm, goarm: "6", bootlin: armv6-eabihf }
          - { platform: armv5, arch: arm, goarm: "5", bootlin: armv5-eabi }
          - { platform: "386", arch: "386", bootlin: x86-i686 }
          - { platform: s390x, arch: s390x, bootlin: s390x-z13 }
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set release version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: printf '%s\n' "${RELEASE_TAG#v}" > config/version

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/html

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod

      - name: Locate Go module cache
        id: go-env
        run: echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore Go module cache
        id: go-mod-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.go-env.outputs.modcache }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Set Go build env (all platforms)
        run: |
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "GOOS=linux" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          if [ -n "${{ matrix.goarm }}" ]; then echo "GOARM=${{ matrix.goarm }}" >> $GITHUB_ENV; fi

      - name: Set up Bootlin musl
        run: |
          set -e
          BOOTLIN_ARCH="${{ matrix.bootlin }}"
          echo "Resolving Bootlin musl toolchain for arch=$BOOTLIN_ARCH (platform=${{ matrix.platform }})"
          TARBALL_BASE="$BOOTLIN_BASE_URL/$BOOTLIN_ARCH/tarballs/"
          TARBALL_URL=$(curl -fsSL "$TARBALL_BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\\.tar\\.xz" | sort -r | head -n1)
          [ -z "$TARBALL_URL" ] && { echo "Failed to locate Bootlin musl toolchain for arch=$BOOTLIN_ARCH" >&2; exit 1; }
          echo "Downloading: $TARBALL_URL"
          cd /tmp
          curl -fL -sS -o "$(basename "$TARBALL_URL")" "$TARBALL_BASE/$TARBALL_URL"
          tar -xf "$(basename "$TARBALL_URL")"
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          TOOLCHAIN_DIR="$(realpath "$TOOLCHAIN_DIR")"
          BIN_DIR="$TOOLCHAIN_DIR/bin"
          echo "PATH=$BIN_DIR:$PATH" >> $GITHUB_ENV
          CC=$(find "$BIN_DIR" -maxdepth 1 \( -name '*-gcc.br_real' -o -name '*-gcc' \) -type f -executable 2>/dev/null | grep -v g++ | head -n1)
          [ -z "$CC" ] && { echo "No gcc found in $BIN_DIR" >&2; exit 1; }
          echo "CC=$(realpath "$CC")" >> $GITHUB_ENV
          SYSROOT=""
          F=$(find "$TOOLCHAIN_DIR" -name "libc-header-start.h" 2>/dev/null | head -1)
          if [ -n "$F" ]; then SYSROOT=$(dirname "$(dirname "$(dirname "$(dirname "$F")")")"); fi
          if [ -n "$SYSROOT" ] && [ -d "$SYSROOT" ]; then
            echo "CGO_CFLAGS=--sysroot=$SYSROOT" >> $GITHUB_ENV
            echo "CGO_LDFLAGS=--sysroot=$SYSROOT -static" >> $GITHUB_ENV
          fi

      - name: Resolve shipping Go dependencies (with retry)
        run: |
          set -e
          export GODEBUG=http2client=0
          for i in 1 2 3 4 5; do
            . ./build-tags.sh
            if go list -deps -tags "$(tags_for release)" . >/dev/null; then
              echo "shipping dependencies resolved"
              exit 0
            fi
            echo "go mod download failed (attempt $i), retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          echo "go mod download failed after 5 attempts" >&2
          exit 1

      - name: Save Go module cache
        if: matrix.platform == 'amd64' && steps.go-mod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go-env.outputs.modcache }}
          key: ${{ steps.go-mod-cache.outputs.cache-primary-key }}

      - name: Build s-ui
        run: |
          set -e
          . ./build-tags.sh
          TAGS=$(tags_for release)
          LDFLAGS=$(ldflags_for release)
          go build -trimpath -ldflags="$LDFLAGS -linkmode external -extldflags '-static'" -tags "$TAGS" -o sui main.go
          file sui
          ldd sui 2>/dev/null || echo "Static binary confirmed"

          mkdir s-ui
          cp sui s-ui/
          cp s-ui.service s-ui/
          cp s-ui.sh s-ui/

      - name: Package
        run: tar -zcvf s-ui-linux-${{ matrix.platform }}.tar.gz s-ui

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: s-ui-linux-${{ matrix.platform }}
          path: ./s-ui-linux-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  low-memory:
    name: Alpine 128 MB runtime check
    needs: build-linux
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: s-ui-linux-amd64
          path: runtime-package
      - name: Start the release binary on Alpine with no swap
        run: |
          set -euo pipefail
          tar -xzf runtime-package/s-ui-linux-amd64.tar.gz -C runtime-package
          mkdir runtime-db
          docker run -d --name m1ss-low-memory --memory=128000000 --memory-swap=128000000 \
            --cpus=1 --pids-limit=128 -e GOMEMLIMIT=64MiB -e GOGC=50 \
            -v "$PWD/runtime-package/s-ui/sui:/app/sui:ro" -v "$PWD/runtime-db:/app/db" \
            -w /app -p 127.0.0.1:2095:2095 -p 127.0.0.1:2096:2096 alpine:3.21 /app/sui
      - name: Exercise panel and subscriptions, then restart with the same SQLite data
        run: |
          python3 scripts/smoke-minimal.py http://127.0.0.1:2095 http://127.0.0.1:2096
          docker restart m1ss-low-memory
          python3 scripts/smoke-minimal.py http://127.0.0.1:2095 http://127.0.0.1:2096
      - name: Record memory and fail on OOM or unexpected exit
        if: always()
        run: |
          docker logs m1ss-low-memory
          docker stats --no-stream m1ss-low-memory
          docker exec m1ss-low-memory sh -c 'cat /sys/fs/cgroup/memory.peak; cat /sys/fs/cgroup/memory.events'
          test "$(docker inspect -f '{{.State.Running}}' m1ss-low-memory)" = true
          test "$(docker inspect -f '{{.State.OOMKilled}}' m1ss-low-memory)" = false
          docker exec m1ss-low-memory sh -c '! grep -Eq "^oom(_kill)? [1-9]" /sys/fs/cgroup/memory.events'
      - name: Clean up disposable runtime
        if: always()
        run: docker rm -f m1ss-low-memory

  build-windows:
    needs: [test, build-frontend]
    name: build-windows-${{ matrix.arch }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: windows-2022, cgo: "1" }
          - { arch: arm64, runner: ubuntu-26.04, cgo: "1" }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set release version
        if: github.event_name == 'push'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: printf '%s\n' "${RELEASE_TAG#v}" > config/version

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/html

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod

      - name: Locate Go module cache
        id: go-env
        shell: bash
        run: echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore Go module cache
        id: go-mod-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.go-env.outputs.modcache }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Install zip for Windows
        if: matrix.arch == 'amd64'
        shell: powershell
        run: |
          # Install Chocolatey if not available
          if (!(Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }
          # Install zip
          choco install zip -y

      # SQLite requires CGO on Windows too; the upstream CGO=0 ARM64 binary
      # compiled successfully but could not open its database at runtime.
      - name: Install pinned LLVM-MinGW for Windows ARM64
        if: matrix.arch == 'arm64'
        shell: bash
        env:
          LLVM_MINGW_ARCHIVE: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64.tar.xz
          LLVM_MINGW_SHA256: 5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$LLVM_MINGW_ARCHIVE"
          toolchain_dir="$RUNNER_TEMP/llvm-mingw"
          curl --retry 3 -fsSL \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/$LLVM_MINGW_ARCHIVE" \
            -o "$archive"
          printf '%s  %s\n' "$LLVM_MINGW_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$toolchain_dir"
          tar -xJf "$archive" -C "$toolchain_dir" --strip-components=1
          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"
          echo "CC=$toolchain_dir/bin/aarch64-w64-mingw32-gcc" >> "$GITHUB_ENV"
          echo "CXX=$toolchain_dir/bin/aarch64-w64-mingw32-g++" >> "$GITHUB_ENV"

      - name: Build s-ui
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=${{ matrix.cgo }}
          export GOOS=windows
          export GOARCH=${{ matrix.arch }}
          
          echo "Building for Windows ${{ matrix.arch }}"
          go version
          go env GOOS GOARCH
          
          . ./build-tags.sh
          TAGS=$(tags_for windows)
          LDFLAGS=$(ldflags_for windows)
          go build -ldflags="$LDFLAGS" -tags "$TAGS" -o sui.exe main.go
          file sui.exe
          
          mkdir s-ui-windows
          cp sui.exe s-ui-windows/
          cp -r windows/* s-ui-windows/

      - name: Save Go module cache
        if: runner.os == 'Windows' && steps.go-mod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go-env.outputs.modcache }}
          key: ${{ steps.go-mod-cache.outputs.cache-primary-key }}

      - name: Package
        shell: bash
        run: |
          zip -r "s-ui-windows-${{ matrix.arch }}.zip" s-ui-windows

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: s-ui-windows-${{ matrix.arch }}
          path: ./s-ui-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30

  # A manual run builds downloadable artifacts without publishing. A version
  # tag publishes only after the test gates and every target have succeeded.
  publish:
    needs: [build-linux, build-windows, low-memory]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: s-ui-*
          merge-multiple: true
          path: dist

      - name: Prepare scripts and verify release assets
        run: |
          set -euo pipefail
          cp install.sh s-ui.sh dist/
          cd dist
          assets=(
            s-ui-linux-amd64.tar.gz
            s-ui-linux-arm64.tar.gz
            s-ui-linux-armv7.tar.gz
            s-ui-linux-armv6.tar.gz
            s-ui-linux-armv5.tar.gz
            s-ui-linux-386.tar.gz
            s-ui-linux-s390x.tar.gz
            s-ui-windows-amd64.zip
            s-ui-windows-arm64.zip
            install.sh
            s-ui.sh
          )
          for asset in "${assets[@]}"; do
            test -s "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          prerelease=false
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
            release_flags+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease="$prerelease" --draft=false
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$RELEASE_SHA" \
              --title "M1ss-UI $RELEASE_TAG" \
              --generate-notes \
              "${release_flags[@]}"
          fi
