name: Build and release M1ss-UI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "26"
  CRONET_GO_REPO: https://github.com/sagernet/cronet-go.git
  BOOTLIN_BASE_URL: https://toolchains.bootlin.com/downloads/releases/toolchains
  LIBCRONET_BASE_URL: "https://github.com/SagerNet/cronet-go/releases/latest/download"

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Validate pushed version tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Use a version tag such as v1.0.0 or v1.0.0-rc.1."
            exit 1
          fi

  test:
    needs: validate
    uses: ./.github/workflows/test.yml

  build-frontend:
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: build-${{ matrix.platform }}
    needs: [test, build-frontend]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: amd64, arch: amd64, bootlin: x86-64, naive: true }
          - { platform: arm64, arch: arm64, bootlin: aarch64, naive: true }
          - { platform: armv7, arch: arm, goarm: "7", bootlin: armv7-eabihf, naive: true }
          - { platform: armv6, arch: arm, goarm: "6", bootlin: armv6-eabihf, naive: false }
          - { platform: armv5, arch: arm, goarm: "5", bootlin: armv5-eabi, naive: false }
          - { platform: "386", arch: "386", bootlin: x86-i686, naive: true }
          - { platform: s390x, arch: s390x, bootlin: s390x-z13, naive: false }
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set release version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: printf '%s\n' "${RELEASE_TAG#v}" > config/version

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/html

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod

      - name: Locate Go module cache
        id: go-env
        run: echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore Go module cache
        id: go-mod-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.go-env.outputs.modcache }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Resolve cronet-go commit
        if: matrix.naive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT=$(go list -m -f '{{.Version}}' github.com/sagernet/cronet-go | sed 's/.*-//')
          FULL=$(gh api "repos/SagerNet/cronet-go/commits/$SHORT" --jq '.sha')
          [[ "$FULL" =~ ^[0-9a-f]{40}$ ]] || { echo "could not resolve cronet-go commit ${SHORT}" >&2; exit 1; }
          echo "cronet-go: $FULL"
          echo "CRONET_COMMIT=$FULL" >> "$GITHUB_ENV"

      # Naive platforms: use cronet toolchain only (no Bootlin).
      - name: Clone cronet-go (cronet toolchain for naive)
        if: matrix.naive
        run: |
          set -e
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin "$CRONET_GO_REPO"
          git -C ~/cronet-go fetch --depth=1 origin "$CRONET_COMMIT"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring (cronet sysroot)
        if: matrix.naive
        run: |
          set -e
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Cache Chromium toolchain
        if: matrix.naive
        id: cache-chromium-toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/cronet-go/naiveproxy/src/third_party/llvm-build/
            ~/cronet-go/naiveproxy/src/gn/out/
            ~/cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            ~/cronet-go/naiveproxy/src/out/sysroot-build/
          key: chromium-toolchain-${{ matrix.platform }}-musl-${{ env.CRONET_COMMIT }}

      - name: Build cronet lib and set toolchain env (CC, CXX, CGO_LDFLAGS, PATH)
        if: matrix.naive
        run: |
          set -euo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env | while IFS= read -r line; do
            line="${line#export }"
            [[ -z "$line" ]] && continue
            echo "$line" >> "$GITHUB_ENV"
          done

      - name: Set Go build env (all platforms)
        run: |
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "GOOS=linux" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          if [ -n "${{ matrix.goarm }}" ]; then echo "GOARM=${{ matrix.goarm }}" >> $GITHUB_ENV; fi

      # These platforms retain the non-Cronet protocol set in the test profile.
      - name: Set up Bootlin musl (armv6, armv5, s390x)
        if: ${{ matrix.naive != true }}
        run: |
          set -e
          BOOTLIN_ARCH="${{ matrix.bootlin }}"
          echo "Resolving Bootlin musl toolchain for arch=$BOOTLIN_ARCH (platform=${{ matrix.platform }})"
          TARBALL_BASE="$BOOTLIN_BASE_URL/$BOOTLIN_ARCH/tarballs/"
          TARBALL_URL=$(curl -fsSL "$TARBALL_BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\\.tar\\.xz" | sort -r | head -n1)
          [ -z "$TARBALL_URL" ] && { echo "Failed to locate Bootlin musl toolchain for arch=$BOOTLIN_ARCH" >&2; exit 1; }
          echo "Downloading: $TARBALL_URL"
          cd /tmp
          curl -fL -sS -o "$(basename "$TARBALL_URL")" "$TARBALL_BASE/$TARBALL_URL"
          tar -xf "$(basename "$TARBALL_URL")"
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          TOOLCHAIN_DIR="$(realpath "$TOOLCHAIN_DIR")"
          BIN_DIR="$TOOLCHAIN_DIR/bin"
          echo "PATH=$BIN_DIR:$PATH" >> $GITHUB_ENV
          CC=$(find "$BIN_DIR" -maxdepth 1 \( -name '*-gcc.br_real' -o -name '*-gcc' \) -type f -executable 2>/dev/null | grep -v g++ | head -n1)
          [ -z "$CC" ] && { echo "No gcc found in $BIN_DIR" >&2; exit 1; }
          echo "CC=$(realpath "$CC")" >> $GITHUB_ENV
          SYSROOT=""
          F=$(find "$TOOLCHAIN_DIR" -name "libc-header-start.h" 2>/dev/null | head -1)
          if [ -n "$F" ]; then SYSROOT=$(dirname "$(dirname "$(dirname "$(dirname "$F")")")"); fi
          if [ -n "$SYSROOT" ] && [ -d "$SYSROOT" ]; then
            echo "CGO_CFLAGS=--sysroot=$SYSROOT" >> $GITHUB_ENV
            echo "CGO_LDFLAGS=--sysroot=$SYSROOT -static" >> $GITHUB_ENV
          fi

      - name: Download Go modules (with retry)
        run: |
          set -e
          export GODEBUG=http2client=0
          for i in 1 2 3 4 5; do
            if go mod download -x; then
              echo "go mod download succeeded"
              exit 0
            fi
            echo "go mod download failed (attempt $i), retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          echo "go mod download failed after 5 attempts" >&2
          exit 1

      - name: Save Go module cache
        if: matrix.platform == 'amd64' && steps.go-mod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go-env.outputs.modcache }}
          key: ${{ steps.go-mod-cache.outputs.cache-primary-key }}

      - name: Build s-ui
        run: |
          set -e
          . ./build-tags.sh
          if [ "${{ matrix.naive }}" = "true" ]; then PROFILE=release; else PROFILE=test; fi
          TAGS=$(tags_for "$PROFILE")
          LDFLAGS=$(ldflags_for "$PROFILE")
          go build -ldflags="$LDFLAGS -linkmode external -extldflags '-static'" -tags "$TAGS" -o sui main.go
          file sui
          ldd sui 2>/dev/null || echo "Static binary confirmed"

          mkdir s-ui
          cp sui s-ui/
          cp s-ui.service s-ui/
          cp s-ui.sh s-ui/

      - name: Package
        run: tar -zcvf s-ui-linux-${{ matrix.platform }}.tar.gz s-ui

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: s-ui-linux-${{ matrix.platform }}
          path: ./s-ui-linux-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-windows:
    needs: [test, build-frontend]
    name: build-windows-${{ matrix.arch }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: windows-2022, cgo: "1" }
          - { arch: arm64, runner: ubuntu-26.04, cgo: "1" }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set release version
        if: github.event_name == 'push'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: printf '%s\n' "${RELEASE_TAG#v}" > config/version

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/html

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod

      - name: Locate Go module cache
        id: go-env
        shell: bash
        run: echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore Go module cache
        id: go-mod-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.go-env.outputs.modcache }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Install zip for Windows
        if: matrix.arch == 'amd64'
        shell: powershell
        run: |
          # Install Chocolatey if not available
          if (!(Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }
          # Install zip
          choco install zip -y

      # SQLite requires CGO on Windows too; the upstream CGO=0 ARM64 binary
      # compiled successfully but could not open its database at runtime.
      - name: Install pinned LLVM-MinGW for Windows ARM64
        if: matrix.arch == 'arm64'
        shell: bash
        env:
          LLVM_MINGW_ARCHIVE: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64.tar.xz
          LLVM_MINGW_SHA256: 5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$LLVM_MINGW_ARCHIVE"
          toolchain_dir="$RUNNER_TEMP/llvm-mingw"
          curl --retry 3 -fsSL \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/$LLVM_MINGW_ARCHIVE" \
            -o "$archive"
          printf '%s  %s\n' "$LLVM_MINGW_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$toolchain_dir"
          tar -xJf "$archive" -C "$toolchain_dir" --strip-components=1
          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"
          echo "CC=$toolchain_dir/bin/aarch64-w64-mingw32-gcc" >> "$GITHUB_ENV"
          echo "CXX=$toolchain_dir/bin/aarch64-w64-mingw32-g++" >> "$GITHUB_ENV"

      - name: Build s-ui
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=${{ matrix.cgo }}
          export GOOS=windows
          export GOARCH=${{ matrix.arch }}
          
          echo "Building for Windows ${{ matrix.arch }}"
          go version
          go env GOOS GOARCH
          
          . ./build-tags.sh
          TAGS=$(tags_for windows)
          LDFLAGS=$(ldflags_for windows)
          go build -ldflags="$LDFLAGS" -tags "$TAGS" -o sui.exe main.go
          file sui.exe
          
          mkdir s-ui-windows
          cp sui.exe s-ui-windows/
          cp -r windows/* s-ui-windows/

      - name: Save Go module cache
        if: runner.os == 'Windows' && steps.go-mod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go-env.outputs.modcache }}
          key: ${{ steps.go-mod-cache.outputs.cache-primary-key }}

      - name: Download libcronet-go
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          curl --retry 3 -fSL -o s-ui-windows/libcronet.dll "$LIBCRONET_BASE_URL/libcronet-windows-$TARGET_ARCH.dll"
          test -s s-ui-windows/libcronet.dll

      - name: Package
        shell: bash
        run: |
          zip -r "s-ui-windows-${{ matrix.arch }}.zip" s-ui-windows

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: s-ui-windows-${{ matrix.arch }}
          path: ./s-ui-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30

  # A manual run builds downloadable artifacts without publishing. A version
  # tag publishes only after the test gates and every target have succeeded.
  publish:
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: s-ui-*
          merge-multiple: true
          path: dist

      - name: Prepare scripts and verify release assets
        run: |
          set -euo pipefail
          cp install.sh s-ui.sh dist/
          cd dist
          assets=(
            s-ui-linux-amd64.tar.gz
            s-ui-linux-arm64.tar.gz
            s-ui-linux-armv7.tar.gz
            s-ui-linux-armv6.tar.gz
            s-ui-linux-armv5.tar.gz
            s-ui-linux-386.tar.gz
            s-ui-linux-s390x.tar.gz
            s-ui-windows-amd64.zip
            s-ui-windows-arm64.zip
            install.sh
            s-ui.sh
          )
          for asset in "${assets[@]}"; do
            test -s "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          prerelease=false
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
            release_flags+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease="$prerelease" --draft=false
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$RELEASE_SHA" \
              --title "M1ss-UI $RELEASE_TAG" \
              --generate-notes \
              "${release_flags[@]}"
          fi
